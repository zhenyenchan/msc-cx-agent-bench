[project]
name = "cx-agent-bench"
version = "0.1.0"
description = "Benchmarking agentic systems for customer feedback analytics"
requires-python = ">=3.11"

[project.scripts]
cx-agent = "cx_agent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]